<html>
<head>
  <title>Web Store</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="hero">
      <h1>Welcome to Web Store</h1>
      <p>Explore our collection of products</p>
    </section>
    <section class="featured-products">
      <h2>Featured Products</h2>
      <ul>
        <li>
          <figure>
            <img src="img/product-1.webp" alt="Product 1">
          </figure>
          <h3>Product 1</h3>
          <p>$19.99</p>
        </li>
        <li>
          <figure>
            <img src="img/product-2.webp" alt="Product 2">
          </figure>
          <h3>Product 2</h3>
          <p>$29.99</p>
        </li>
        <li>
          <figure>
            <img src="img/product-3.webp" alt="Product 3">
          </figure>
          <h3>Product 3</h3>
          <p>$39.99</p>
        </li>
      </ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
